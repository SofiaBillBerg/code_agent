project:
  type: website
  output-dir: docs/docs_web
  pre-render:
    - "project_management/run_diagrams.sh"
  render:
    - "docs/*.qmd"
    - "docs/README.qmd"
    - "docs/*.md"
    - "docs/*.ipynb"
    - "!docs/docs_web/**/*.*"
    - "!pdf_docs/*.qmd"
    - "!.*/*.*"
    - "!notes/*.*"
    - "!apidocs/**/*.*"
    - "CHANGELOG.qmd"
website:
  title: "Code Agent"
  llms-txt: true
  navbar:
    left:
      - text: "Home"
        href: docs/README.qmd
      - text: "API Reference"
        href: docs/API.qmd
      - text: "Guides"
        href: docs/USAGE.qmd
      - text: "Community"
        href: docs/CONTRIBUTING.qmd
    right:
      - icon: github
        href: "https://github.com/SofiaBillBerg/code_agent"
        text: "GitHub"
  sidebar:
    - title: "Introduction"
      style: "docked"
      contents:
        - text: "Quick Start"
          href: docs/QUICKSTART.qmd
    - title: "Guides"
      contents:
        - text: "Example Usage"
          href: docs/USAGE.qmd
        - text: "Tools"
          href: docs/TOOLS.qmd
        - text: "Configuration"
          href: docs/CONFIGURATION.qmd
    - title: "Reference"
      contents:
        - text: "API Reference Overview"
          href: docs/API.qmd
        - text: "API Reference"
          href: apidocs/apidocs-help.html
    - title: "Community"
      contents:
        - text: "Contributing"
          href: docs/CONTRIBUTING.qmd
        - text: "News & Changelog"
          href: CHANGELOG.qmd
        - text: "FAQ & Troubleshooting"
          href: docs/FAQ.qmd


format:
  html:
    theme:
      - docs/styles/custom.css
    css:
      - docs/styles/quartz-contrast.css
      - docs/styles/dt-wrap.css
    highlight-style: pygments
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-overflow: wrap
    code-annotations: select
    code-copy: true
    toc-title: "On this page"
    lightbox: true
    citations-hover: true
    # self-contained: true
    code-summary: "Show/Hide Code"
    date: "2025-11-02"
    date-format: "iso"
    code-links: true
    author: "Sofia Billger Bergström"
    date-modified: last-modified
    # embed-resources: true
    fig-cap-location: bottom
    fig-format: svg
    tbl-cap-location: top
    subtitle: "Documentation for The code_agent - an interactive, locally maintained LLM-powered assistant"
    description: "The code_agent is a local, LLM-driven code assistant that can scaffold projects, edit files, generate tests, and produce documentation. It is built on top of LangChain and uses a local Ollama instance as the LLM backend."
    fig-env: figure
    cache: true
    includesource: true
    wrap: auto
    touch: true
    search: false
    fig-responsive: true
resources:
  - docs/
  - LICENSE
  - docs/visualizations/svg/
#  - apidocs/
filters:
  - include-code-files
  - inline-svg
extensions:
  badge:
    - key: CodeAgent
      colour: orchid
      icon: chat-right-quote-fill
    - key: experimental
      colour: lime
      icon: flask
    - key: deprecated
      colour: gray
      icon: archive-fill
    - key: docs
      colour: rebeccapurple
      href: docs/README.qmd
      icon: icon
      target: _self
