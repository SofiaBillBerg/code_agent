# Berg Agents harness profiles (user-editable).
#
# Each top-level key is either a bare provider name (e.g. "ollama") for
# provider-wide defaults, or "provider:model" for a per-model override.
# IMPORTANT: a model identifier that itself contains a ":" (e.g. the Ollama
# model "gpt-oss:20b") can NOT be used as an exact "provider:model" key -
# register it under the bare provider key instead, which matches all models
# of that provider.
#
# Values are HarnessProfile fields. Common fields:
#   base_system_prompt:   str | None   - replaces the agent base prompt
#   system_prompt_suffix: str | None   - appended to the base prompt
#   excluded_tools:       list[str]    - built-in tools hidden from the model
#   tool_description_overrides: {tool: "new description"}
#   excluded_middleware:  list[str]    - middleware classes to disable
#
# JSON files are also accepted (JSON is a YAML subset).  This file is read by
# berg_agents.agents.codeagent.build_berg_agents by default; pass
# register_profiles=False to launch without these profiles.

# Example: tune every Ollama model (covers "gpt-oss:20b" whose id has a ":").
"ollama":
  system_prompt_suffix: "Be concise and prefer minimal, focused diffs. Workspace files are mounted at /workspace (maps to project cwd). Always use /workspace prefix with filesystem tools, e.g., ls(path=\"/workspace\"), read_file(path=\"/workspace/README.md\"), glob(pattern=\"**/*.py\", path=\"/workspace\")."
  # Tool trimming: hide tools from small/local models to save context.
  # Exact names or glob patterns; matches built-ins AND MCP tools
  # (MCP tools are named mcp_<server>__<tool>, e.g. "mcp_memory__*").
  excluded_tools:
    - "mcp_*"
  tool_description_overrides:
    read_file: "Read a file from the workspace (read-only)."
    edit_file: "Edit a file in the workspace (read-write)."
    ls: "List files in the workspace."
    write_file: "Write to a file in the workspace."
    glob: "Find files in the workspace."
    grep: "Search for patterns in the workspace."
    delete: "Delete a file from the workspace."
    execute: "Execute a command in the workspace."
    task_manager: "Manage tasks in the workspace."
    general_chat: "General-purpose chat tool for asking questions and getting answers."
    search_explain: "Search the web for information relevant to the current task."
